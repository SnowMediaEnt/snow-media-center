apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// RELEASE SIGNING.
// This project had NO signing configuration at all, which is why an in-app
// update could fail while a fresh install worked: `assembleRelease` produced an
// unsigned APK, and anything built through Android Studio's Run button is
// signed with the machine-local DEBUG key. Android refuses to install an update
// whose signing key differs from the copy already on the device — and reports
// it only as a bare "App not installed".
//
// Put your real keystore details in android/keystore.properties (gitignored):
//
//   storeFile=/absolute/path/to/snowmedia-release.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
//
// With that file present every release build is signed with the SAME key, so
// updates install over each other. Without it the build still works (falling
// back to the debug key) but updates will only ever install over other builds
// from the same machine.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystorePropsFile.exists() && keystoreProps['storeFile']
// LOUD, because the silent version of this already cost a full reinstall of
// every install in the field. With no keystore.properties the release build
// falls back to the machine-local DEBUG key — which is auto-generated per
// machine, has a public password, expires after a year, and lives in a hidden
// folder nobody backs up. Ship on it and the day that file disappears is the
// day you can no longer update your own app.
if (!hasReleaseKeystore) {
    logger.warn(
        "\n" +
        "################################################################\n" +
        "#  NO RELEASE KEYSTORE — this build will be signed with the    #\n" +
        "#  machine-local DEBUG key. DO NOT DISTRIBUTE IT.              #\n" +
        "#                                                              #\n" +
        "#  Create android/keystore.properties:                         #\n" +
        "#    storeFile=/absolute/path/to/snowmedia-release.jks         #\n" +
        "#    storePassword=...                                         #\n" +
        "#    keyAlias=...                                              #\n" +
        "#    keyPassword=...                                           #\n" +
        "#                                                              #\n" +
        "#  Then back that .jks up in three places. It is the only      #\n" +
        "#  thing that can ever update the installs already out there.  #\n" +
        "################################################################\n")
}

// BILLING ACCOUNT (docs/billing/API.md).
// The app key is a shared secret that is rotated before every release. It is
// read from android/local.properties (gitignored) or a Gradle property, never
// from a source file:
//
//   SMC_BILLING_APP_KEY=...
//   SMC_BILLING_BASE_URL=https://billing.smcdreamstreams.store/smc/v1   (optional)
//
// With no key the app still builds; the billing screens then report
// "not configured" and stay hidden behind the billing_account feature flag.
def localPropsFile = rootProject.file("local.properties")
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def billingAppKey = localProps['SMC_BILLING_APP_KEY'] ?: project.findProperty('SMC_BILLING_APP_KEY') ?: System.getenv('SMC_BILLING_APP_KEY') ?: ''
def billingBaseUrl = localProps['SMC_BILLING_BASE_URL'] ?: project.findProperty('SMC_BILLING_BASE_URL') ?: 'https://billing.smcdreamstreams.store/smc/v1'
if (!billingAppKey) {
    logger.warn("\n#  SMC_BILLING_APP_KEY is not set in android/local.properties — billing account features will be disabled in this build.\n")
}


android {
    namespace "com.snowmedia"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.lovable.f44324110df840aea0a1fb97cafa76e7"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName "1.7.2"

        // Never hardcode the key in Kotlin; see the block above.
        buildConfigField "String", "SMC_BILLING_APP_KEY", "\"${billingAppKey}\""
        buildConfigField "String", "SMC_BILLING_BASE_URL", "\"${billingBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Include both 32-bit and 64-bit ABIs for FireTV and older devices
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        aaptOptions {
             // Files and dirs to omit from the packaged APK
             ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Never ship an UNSIGNED release again — an unsigned APK cannot be
            // installed at all. Falls back to the debug key so a checkout with
            // no keystore.properties still builds.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    // Increase JVM heap for 32-bit builds
    dexOptions {
        javaMaxHeapSize "2g"
    }

    buildFeatures {
        // AGP 8 no longer generates BuildConfig by default; the billing key lives there.
        buildConfig true
    }

    testOptions {
        unitTests.all {
            // Fail loudly instead of hanging when a test waits on MockWebServer.
            testLogging { events "failed"; exceptionFormat "full" }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media3:media3-exoplayer:1.5.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.0"
    implementation "androidx.media3:media3-ui:1.5.0"
    // Software Dolby/DTS decoding (AC-3/E-AC-3/DTS/TrueHD) via FFmpeg — activates
    // the EXTENSION_RENDERER_MODE_PREFER path already set in SnowPlayerPlugin.
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1"
    // Background alert poll (see com.snowmedia.notify.AlertPollWorker).
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation project(':capacitor-android')
    // Billing account: HTTP client and the encrypted token store
    // (com.snowmedia.billing). OkHttp is plain JVM so the API client and the
    // polling loop run under unit tests against MockWebServer.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    // A real org.json for JVM unit tests; android.jar's copy is stubs that throw.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}